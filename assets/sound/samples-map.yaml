# Where each sound effect lives in the sample ROM.
#
# vromtool reads this, packs the samples into the V ROM and generates
# assets/samples.inc with each one's start and stop offset, which the Z80
# sound driver in src/user_commands.s refers to by name.
#
# The WAVs are built from the sources in assets/sound/ by the makefile: mono
# at 18.5 kHz, because that is the fixed rate of the YM2610's ADPCM-A
# channels. Three of them are cut out of longer recordings - see the makefile
# for which part of which file each one takes.

- adpcm_a:
    name: gong
    uri: file://build/assets/sfx/gong.wav
- adpcm_a:
    name: jump
    uri: file://build/assets/sfx/jump.wav
- adpcm_a:
    name: punch
    uri: file://build/assets/sfx/punch.wav
- adpcm_a:
    name: taiko
    uri: file://build/assets/sfx/taiko.wav
- adpcm_a:
    name: koto
    uri: file://build/assets/sfx/koto.wav
- adpcm_a:
    name: hit
    uri: file://build/assets/sfx/hit.wav
- adpcm_a:
    name: step
    uri: file://build/assets/sfx/step.wav
